<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account · Cups &amp; Pups</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
      <script src="/js/runtime-config.js"></script>
  </head>
  <body>
    <header id="site-header"></header>
    <main class="page">
      <h1>Create account</h1>
      <form class="form" id="register-form">
        <div class="form-row two">
          <label>
            First name
            <input type="text" name="firstName" required />
          </label>
          <label>
            Last name
            <input type="text" name="lastName" required />
          </label>
        </div>
        <label>
          Email
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label>
          Phone (optional)
          <input type="tel" name="phone" />
        </label>
        <label>
          Password
          <input
            type="password"
            name="password"
            required
            minlength="8"
            autocomplete="new-password"
          />
        </label>
        <p class="form-error" id="register-error" hidden></p>
        <button class="btn btn-espresso" type="submit">Create account</button>
      </form>
      <p class="form-note">
        Already have an account? <a href="/login">Log in</a>
      </p>
    </main>
    <footer id="site-footer"></footer>
    <script src="/js/chrome.js"></script>
    <script type="module">
      import { api, saveTokens, saveUser } from '/js/api.js';

      mountChrome();

      const form = document.getElementById('register-form');
      const errorEl = document.getElementById('register-error');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorEl.hidden = true;
        const button = form.querySelector('button');
        button.disabled = true;
        button.textContent = 'Creating…';

        const raw = Object.fromEntries(new FormData(form).entries());
        const payload = {
          firstName: raw.firstName,
          lastName: raw.lastName,
          email: raw.email,
          password: raw.password,
        };
        if (raw.phone) payload.phone = raw.phone;

        try {
          const result = await api('/auth/register', {
            method: 'POST',
            body: JSON.stringify(payload),
          });
          saveTokens(result);
          if (result.user) saveUser(result.user);
          window.location.href = '/account';
        } catch (err) {
          errorEl.textContent = err.message || 'Registration failed';
          errorEl.hidden = false;
          button.disabled = false;
          button.textContent = 'Create account';
        }
      });
    </script>
  </body>
</html>
